; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

; Configuración común a todas las placas.
[env:base]
platform = espressif32
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.14.5
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
    adafruit/Adafruit SHT4x Library@^1.0.0
    adafruit/Adafruit ADS1X15@^2.0.0
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.1
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.1
    adafruit/Adafruit AHTx0@^2.0.0
    adafruit/Adafruit SHT31 Library@^2.2.0
    adafruit/Adafruit BMP280 Library@^2.6.7
    adafruit/Adafruit VEML6075 Library@^2.0.0
    adafruit/Adafruit SCD30@^1.0.6
    adafruit/Adafruit SGP30 Sensor@^2.0.0
    sparkfun/SparkFun AS3935 Lightning Detector Arduino Library@^1.4.9
    4-20ma/ModbusMaster@^2.0.1
    jgromes/RadioLib@^6.0.0
    adafruit/Adafruit PM25 AQI Sensor@^1.0.6

; ESP32 clásico con MAC Ethernet nativa (LAN8720A por RMII).
; Aplica a: ESP32-WROOM-32, WROVER, D0WDQ6, D0WD, S0WD, P4.
[env:esp32doit-devkit-v1]
extends = env:base
board = esp32doit-devkit-v1
board_upload.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
build_flags =
    -D BOARD_ESP32_WROOM
    ; --- Perfil de hardware (ver include/hw/HwProfile.hpp) ---
    -D SEMA_USE_ETHERNET=1
    -D SEMA_USE_LORA=1
    -D SEMA_USE_MODBUS=1
    -D SEMA_MODBUS_ISOLATED=1
    -D SEMA_USE_CAN=1
    -D SEMA_USE_ZIGBEE=1
    -D SEMA_PINS_FROM_FILE=0

; ESP32 sin MAC Ethernet nativa (W5500 por SPI).
; Aplica a: ESP32-S2, S3, C2, C3, C5, C6, H2.
[env:esp32-s3-devkitc-1]
extends = env:base
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
    -D BOARD_ESP32_S3
    ; --- Perfil de hardware (ver include/hw/HwProfile.hpp) ---
    -D SEMA_USE_ETHERNET=1
    -D SEMA_USE_LORA=1
    -D SEMA_USE_MODBUS=1
    -D SEMA_MODBUS_ISOLATED=1
    -D SEMA_USE_CAN=1
    -D SEMA_USE_ZIGBEE=1
    -D SEMA_PINS_FROM_FILE=0

; ESP32-WROOM-32U 16 MB — PCB futura (en diseño).
; Pines fijos (SEMA_PINS_FROM_FILE=1): no configurables por la web.
[env:esp32-wroom-32u]
extends = env:base
board = esp32dev
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
build_flags =
    -D BOARD_ESP32_WROOM32U
    ; --- Perfil de hardware (ver include/hw/HwProfile.hpp) ---
    -D SEMA_USE_ETHERNET=1
    -D SEMA_USE_LORA=1
    -D SEMA_USE_MODBUS=1
    -D SEMA_MODBUS_ISOLATED=1
    -D SEMA_USE_CAN=1
    -D SEMA_USE_ZIGBEE=1
    -D SEMA_PINS_FROM_FILE=1
