[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.partitions = partitions.csv
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.14.5
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
    adafruit/Adafruit SHT4x Library@^1.0.0
    adafruit/Adafruit ADS1X15@^2.0.0
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.1
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.1
    adafruit/Adafruit AHTx0@^2.0.0
    adafruit/Adafruit SHT31 Library@^2.2.0
    adafruit/Adafruit BMP280 Library@^2.6.7
    adafruit/Adafruit VEML6075 Library@^2.0.0
    adafruit/Adafruit SCD30@^1.0.6
    adafruit/Adafruit SGP30 Sensor@^2.0.0
    sparkfun/SparkFun AS3935 Lightning Detector Arduino Library@^1.4.9
    4-20ma/ModbusMaster@^2.0.1
    jgromes/RadioLib@^6.0.0
    adafruit/Adafruit PM25 AQI Sensor@^1.0.6
