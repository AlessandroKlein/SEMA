; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

; Configuración común a todas las placas.
[env:base]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.14.5
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
    adafruit/Adafruit SHT4x Library@^1.0.0
    adafruit/Adafruit ADS1X15@^2.0.0
    ; OneWire fijado a commit 4f5cd5b4 (añade soporte ESP32-C6; 2.3.8 no lo trae)
    https://github.com/PaulStoffregen/OneWire.git#4f5cd5b4ed0d9f33d25d73a2d906de0e1b10698a
    milesburton/DallasTemperature@^3.9.1
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.1
    adafruit/Adafruit AHTx0@^2.0.0
    adafruit/Adafruit SHT31 Library@^2.2.0
    adafruit/Adafruit BMP280 Library@^2.6.7
    adafruit/Adafruit VEML6075 Library@^2.0.0
    adafruit/Adafruit SCD30@^1.0.6
    adafruit/Adafruit SGP30 Sensor@^2.0.0
    sparkfun/SparkFun AS3935 Lightning Detector Arduino Library@^1.4.9
    4-20ma/ModbusMaster@^2.0.1
    jgromes/RadioLib@^6.0.0
    adafruit/Adafruit PM25 AQI Sensor@^1.0.6
    adafruit/Adafruit CCS811 Library@^1.1.0
    https://github.com/AlessandroKlein/ESP32-Base.git#v0.9.0

; ESP32 clásico con MAC Ethernet nativa (LAN8720A por RMII).
; Aplica a: ESP32-WROOM-32, WROVER, D0WDQ6, D0WD, S0WD, P4.
[env:esp32doit-devkit-v1]
extends = env:base
board = esp32doit-devkit-v1
board_upload.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
build_flags =
    ; --- Versión del firmware (fuente de verdad: platformio.ini; ver VERSIONADO.md) ---
    -D SEMA_FW_VERSION=\"1.113.0\"
    -D SEMA_HW_VERSION=\"rev0\"
    -D SEMA_CONFIG_SCHEMA_VERSION=1
    -D SEMA_PROTOCOL_VERSION=1
    -D BOARD_ESP32_WROOM
    ; --- Perfil de hardware (ver include/hw/HwProfile.hpp) ---
    -D SEMA_USE_ETHERNET=1
    -D SEMA_USE_LORA=1
    -D SEMA_USE_MODBUS=1
    -D SEMA_MODBUS_ISOLATED=1
    -D SEMA_USE_CAN=1
    -D SEMA_USE_ZIGBEE=1
    -D SEMA_USE_MESH_ESPNOW=1
    -D SEMA_PINS_FROM_FILE=0

; ESP32 sin MAC Ethernet nativa (W5500 por SPI).
; Aplica a: ESP32-S2, S3, C2, C3, C5, C6, H2.
[env:esp32-s3-devkitc-1]
extends = env:base
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
    ; --- Versión del firmware (fuente de verdad: platformio.ini; ver VERSIONADO.md) ---
    -D SEMA_FW_VERSION=\"1.113.0\"
    -D SEMA_HW_VERSION=\"rev0\"
    -D SEMA_CONFIG_SCHEMA_VERSION=1
    -D SEMA_PROTOCOL_VERSION=1
    -D BOARD_ESP32_S3
    ; --- Perfil de hardware (ver include/hw/HwProfile.hpp) ---
    -D SEMA_USE_ETHERNET=1
    -D SEMA_USE_LORA=1
    -D SEMA_USE_MODBUS=1
    -D SEMA_MODBUS_ISOLATED=1
    -D SEMA_USE_CAN=1
    -D SEMA_USE_ZIGBEE=1
    -D SEMA_PINS_FROM_FILE=0

; ESP32-C6 — RISC-V single-core, WiFi 6 + BLE 5 + 802.15.4 (Matter/Thread/Zigbee).
; Sin MAC Ethernet nativa ni controlador CAN (TWAI). Objetivo: esclavo que
; descarga web/Ethernet del principal, o coordinador 802.15.4. Validación del
; core en modo mínimo (Ethernet/LoRa/CAN/Zigbee deshabilitados; se habilitan
; incrementalmente tras validar el core).
[env:esp32-c6-devkitc-1]
extends = env:base
board = esp32-c6-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
    ; --- Versión del firmware (fuente de verdad: platformio.ini; ver VERSIONADO.md) ---
    -D SEMA_FW_VERSION=\"1.113.0\"
    -D SEMA_HW_VERSION=\"rev0\"
    -D SEMA_CONFIG_SCHEMA_VERSION=1
    -D SEMA_PROTOCOL_VERSION=1
    -D BOARD_ESP32_C6
    -D SEMA_USE_ETHERNET=0
    -D SEMA_USE_LORA=0
    -D SEMA_USE_MODBUS=0
    -D SEMA_USE_CAN=0
    -D SEMA_USE_ZIGBEE=0
    -D SEMA_PINS_FROM_FILE=0

; ESP32-C3 — esclavo ligero de la malla (web/Ethernet deshabilitados).
; Nodo sensor de bajo coste: publica mediciones por ESP-NOW al maestro.
[env:esp32-c3-devkitm-1]
extends = env:base
board = esp32-c3-devkitm-1
board_upload.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
build_flags =
    ; --- Versión del firmware (fuente de verdad: platformio.ini; ver VERSIONADO.md) ---
    -D SEMA_FW_VERSION=\"1.113.0\"
    -D SEMA_HW_VERSION=\"rev0\"
    -D SEMA_CONFIG_SCHEMA_VERSION=1
    -D SEMA_PROTOCOL_VERSION=1
    -D BOARD_ESP32_C3
    ; --- Perfil esclavo ligero (sin web ni Ethernet) ---
    -D SEMA_USE_WEB=0
    -D SEMA_USE_ETHERNET=0
    -D SEMA_USE_LORA=0
    -D SEMA_USE_MODBUS=0
    -D SEMA_USE_CAN=0
    -D SEMA_USE_ZIGBEE=0
    ; ESP32-C3 no tiene periférico PCNT (SOC_PCNT_SUPPORTED=0): apagar el sensor
    -D SEMA_USE_SENSOR_PCNT=0
    ; ESP32-C3 no tiene periférico PCNT (SOC_PCNT_SUPPORTED=0): apagar el sensor
    -D SEMA_USE_SENSOR_PCNT=0
    -D SEMA_USE_MESH_ESPNOW=1
    -D SEMA_PINS_FROM_FILE=0

; ESP32-S2 — esclavo ligero de la malla (web/Ethernet deshabilitados).
; Nodo sensor: publica mediciones por ESP-NOW al maestro.
[env:esp32-s2-saola-1]
extends = env:base
board = esp32-s2-saola-1
board_upload.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
build_flags =
    ; --- Versión del firmware (fuente de verdad: platformio.ini; ver VERSIONADO.md) ---
    -D SEMA_FW_VERSION=\"1.113.0\"
    -D SEMA_HW_VERSION=\"rev0\"
    -D SEMA_CONFIG_SCHEMA_VERSION=1
    -D SEMA_PROTOCOL_VERSION=1
    -D BOARD_ESP32_S2
    ; --- Perfil esclavo ligero (sin web ni Ethernet) ---
    -D SEMA_USE_WEB=0
    -D SEMA_USE_ETHERNET=0
    -D SEMA_USE_LORA=0
    -D SEMA_USE_MODBUS=0
    -D SEMA_USE_CAN=0
    -D SEMA_USE_ZIGBEE=0
    -D SEMA_USE_MESH_ESPNOW=1
    -D SEMA_PINS_FROM_FILE=0

; ESP32-WROOM-32U 16 MB — PCB futura (en diseño).
; Pines fijos (SEMA_PINS_FROM_FILE=1): no configurables por la web.
[env:esp32-wroom-32u]
extends = env:base
board = esp32dev
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
build_flags =
    ; --- Versión del firmware (fuente de verdad: platformio.ini; ver VERSIONADO.md) ---
    -D SEMA_FW_VERSION=\"1.113.0\"
    -D SEMA_HW_VERSION=\"rev0\"
    -D SEMA_CONFIG_SCHEMA_VERSION=1
    -D SEMA_PROTOCOL_VERSION=1
    -D BOARD_ESP32_WROOM32U
    ; --- Perfil de hardware (ver include/hw/HwProfile.hpp) ---
    -D SEMA_USE_ETHERNET=1
    -D SEMA_USE_LORA=1
    -D SEMA_USE_MODBUS=1
    -D SEMA_MODBUS_ISOLATED=1
    -D SEMA_USE_CAN=1
    -D SEMA_USE_ZIGBEE=1
    -D SEMA_PINS_FROM_FILE=1

; Modo demo: valores ficticios para probar la web sin sensores conectados.
; Mismas features que esp32doit-devkit-v1, con -D SEMA_DEMO=1.
[env:demo]
extends = env:esp32doit-devkit-v1
build_flags =
    ${env:esp32doit-devkit-v1.build_flags}
    -D SEMA_DEMO=1

; ESP32-WROOM-32U 32 MB — variante de la PCB con flash de 32 MB.
[env:esp32-wroom-32u-32mb]
extends = env:esp32-wroom-32u
board_upload.flash_size = 32MB
board_build.partitions = partitions_32mb.csv
build_flags =
    ${env:esp32-wroom-32u.build_flags}
    -D BOARD_ESP32_WROOM32U_32MB

; ESP32-P4 — RISC-V sin WiFi/BT ni MAC Ethernet (perfil experimental).
